name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag, for example v3.0 (leave empty to only build)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4


      - name: Flight physics test
        run: node app/src/test/js/flight.test.js

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      # Optional: sign with your own key. Without these secrets the APK is signed with a throw-away debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TVDRAW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          TVDRAW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TVDRAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TVDRAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk lamma.apk
          cp phone/build/outputs/apk/release/phone-release.apk lamma-phone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lamma-apk
          path: |
            lamma.apk
            lamma-phone.apk

      # The release page shows every changelog entry since the release before this one.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          PREV=$(git tag --sort=-v:refname | grep -vx "$TAG" | head -1)
          awk -v stop="## ${PREV#v}" 'started && $0 == stop { exit } /^## / { started = 1 } started { print }' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
          printf '\n**Files:** `lamma.apk` is the app for the TV; `lamma-phone.apk` is the optional app for the phone.\n' >> notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Lamma ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            lamma.apk
            lamma-phone.apk
          body_path: notes.md
