<!doctype html><html lang=ar><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Lamma flight</title><link rel=stylesheet href=cesium/Widgets/widgets.css>
<style>@font-face{font-family:L;src:url(font.ttf)}
html,body{margin:0;height:100%;background:#0a1220;overflow:hidden;font-family:L,sans-serif;color:#fff}
#c{position:absolute;inset:0}#hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#credits{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-size:10px;opacity:.85;text-align:center;white-space:nowrap;direction:ltr}
#credits img{max-height:16px}.cesium-credit-lightbox-overlay{display:none}
#menu{position:absolute;right:4%;top:16%;width:38%;background:rgba(8,16,36,.88);border:2px solid #f2c14e;border-radius:18px;padding:14px 16px;direction:rtl}
#menu[dir=ltr]{direction:ltr}#menu h2{margin:0 0 8px;font-size:3.6vh;color:#f2c14e}
#menu{top:6%;max-height:88%;overflow:hidden}#menu div{font-size:3vh;padding:.75vh 1.6vh;border-radius:12px;margin:.4vh 0;background:rgba(255,255,255,.07)}#menu div.on{background:#1f6fd6}
#menu div b{display:inline-block;width:1.6em;color:#f2c14e}
#msg[hidden]{display:none}.cesium-widget-errorPanel{display:none!important}#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:4.4vh;padding:0 10%;background:#0a1220;direction:rtl;line-height:1.6}</style></head>
<body><div id=c></div><canvas id=hud></canvas><div id=credits></div><div id=menu hidden></div><div id=msg>✈️</div>
<script src=core.js></script><script src=sim.js></script>
<script>/* Choose the engine: the full one (CesiumJS) needs a modern graphics chip; an old one gets the light engine. Whatever fails falls back to the light one. */
(function () { var conf = FlySim.conf, eng = conf.eng | 0, went = false;
  function load(src, then, bad) { var s = document.createElement('script'); s.src = src; s.onload = then || null; s.onerror = bad || null; document.body.appendChild(s); }
  function strong() { try { var g = document.createElement('canvas').getContext('webgl2'); if (!g) return false; var hp = g.getShaderPrecisionFormat(g.FRAGMENT_SHADER, g.HIGH_FLOAT); return !!hp && hp.precision > 0; } catch (e) { return false; } }
  window.flyBoot = { why: '', light: function (why) { if (went) return; went = true; flyBoot.why = why || ''; load('light.js'); } };
  if (eng === 1 || (eng === 0 && !strong())) flyBoot.light(eng === 1 ? 'chosen' : 'old chip');
  else { window.CESIUM_BASE_URL = 'cesium/'; load('cesium/Cesium.js', function () { load('cz.js', null, function () { flyBoot.light('no engine file'); }); }, function () { flyBoot.light('no library'); }); }
})();</script></body></html>
